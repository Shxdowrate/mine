name: build

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logrepo && cp build.log /tmp/logrepo/ && cd /tmp/logrepo
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build log for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:ci-logs

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: solorust-jar
          path: build/libs/*.jar

      - name: Update "latest" release (on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Последняя сборка (${GITHUB_SHA::7})" \
            --notes "Автосборка из ветки main. Кидай .jar в папку mods (нужны Fabric Loader и Fabric API для 26.1.x)."

      - name: Publish release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
