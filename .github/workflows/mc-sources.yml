# Служебный: декомпилирует Minecraft и кладёт исходники в ветку mc-src (для сверки API при разработке).
name: mc-sources

on:
  push:
    branches: ["tools-mcsrc"]

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decompile
        run: |
          chmod +x ./gradlew
          ./gradlew genSources --stacktrace
      - name: Push sources to mc-src branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/src && cd /tmp/src
          find ~/.gradle "$GITHUB_WORKSPACE" -name "*.jar" 2>/dev/null | grep -i -E "minecraft|merged|common|client" > jars.txt || true
          grep -i "sources" jars.txt | grep -i minecraft | tee found.txt | while read JAR; do
            unzip -q -o "$JAR" 'net/minecraft/*' 'com/mojang/*' || unzip -q -o "$JAR" || true
          done
          find . -type f -name '*.json' -delete || true
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "Minecraft sources"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:mc-src
