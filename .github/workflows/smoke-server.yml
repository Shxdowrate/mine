name: smoke-server

on:
  push:
    branches: ["infinity-and-strange"]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run dedicated server
        run: |
          chmod +x ./gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:normal\n" > run/server.properties
          (timeout 420 ./gradlew runServer --console=plain > server.log 2>&1; true)
          grep -E "Done \(|ERROR|Exception|solorust" server.log | head -200 || true
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/l && cp server.log /tmp/l/ && cp run/logs/latest.log /tmp/l/ 2>/dev/null || true
          cd /tmp/l && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "smoke log" && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:smoke-logs
