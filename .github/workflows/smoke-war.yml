# Временный: запускает выделенный сервер в мирах War Machines и WarFlat и проверяет лагеря бандитов.
name: smoke-war

on:
  push:
    branches: ["war-machines"]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: ["war_machines", "war_flat"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run dedicated server
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain -q
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=solorust\\:${{ matrix.preset }}\nspawn-protection=0\n" > run/server.properties
          mkfifo in.fifo
          (timeout 600 ./gradlew runServer --console=plain < in.fifo > server.log 2>&1; echo "SERVER EXIT $?" >> server.log) &
          exec 3>in.fifo
          send() { echo "$1" >&3; sleep "${2:-3}"; }
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 3; done
          send "summon solorust:bandit 0 120 0"
          send "execute if entity @e[type=solorust:bandit]"
          send "locate structure #minecraft:village" 25
          LINE=$(grep -oE "is at \[-?[0-9]+, [^,]+, -?[0-9]+\]" server.log | head -1)
          X=$(echo "$LINE" | sed -E 's/is at \[(-?[0-9]+), [^,]+, (-?[0-9]+)\]/\1/')
          Z=$(echo "$LINE" | sed -E 's/is at \[(-?[0-9]+), [^,]+, (-?[0-9]+)\]/\2/')
          echo "VILLAGE AT $X $Z" | tee -a marks.txt
          if [ -n "$X" ]; then
            send "forceload add $((X-64)) $((Z-64)) $((X+64)) $((Z+64))" 60
            send "execute if entity @e[type=minecraft:villager]"
            send "execute if entity @e[type=solorust:bandit]"
            send "execute if entity @e[type=solorust:bandit,nbt={Role:5}]" 5
          fi
          send "stop" 30
          exec 3>&-
          wait || true
          grep -E "Done \(|ERROR|Exception|Caused by|solorust|Test (passed|failed)|nearest|VILLAGE|Found no|SERVER EXIT|Forced|forceload" server.log | head -300 || true
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/l && cp server.log /tmp/l/ && cp run/logs/latest.log /tmp/l/ 2>/dev/null || true
          cd /tmp/l && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "smoke log ${{ matrix.preset }}" && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:smoke-${{ matrix.preset }}
